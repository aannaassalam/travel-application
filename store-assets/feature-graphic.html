<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url("../assets/fonts/Fraunces-Bold.ttf");font-weight:700}
@font-face{font-family:Inter;src:url("../assets/fonts/Inter-Regular.ttf");font-weight:400}
@font-face{font-family:Inter;src:url("../assets/fonts/Inter-SemiBold.ttf");font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
.g{position:relative;width:1024px;height:500px;background:
   radial-gradient(120% 140% at 8% 15%, #17497a 0%, #0e2f4f 45%, #0a2540 100%);
   font-family:Inter,system-ui}
/* amber glow, bottom-left */
.glow{position:absolute;left:-160px;bottom:-220px;width:620px;height:620px;border-radius:50%;
   background:radial-gradient(circle,rgba(245,166,35,.28) 0%,rgba(245,166,35,0) 65%)}
.photos{position:absolute;right:48px;top:-24px;height:548px;transform:rotate(-6deg);
   display:flex;gap:16px;align-items:flex-start}
.photos img{width:152px;height:548px;object-fit:cover;border-radius:20px;
   box-shadow:0 26px 64px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.10)}
.photos .a{margin-top:26px}.photos .b{margin-top:-14px}.photos .c{margin-top:14px}
.fade{position:absolute;inset:0;
   background:linear-gradient(90deg,#0a2540 0%,#0a2540 30%,rgba(10,37,64,.86) 46%,rgba(10,37,64,.30) 62%,rgba(10,37,64,.06) 78%)}
.copy{position:absolute;left:64px;top:0;height:500px;width:600px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.copy img{width:340px}
h1{font-family:Fraunces;font-weight:700;font-size:44px;line-height:1.12;color:#fff;letter-spacing:-.5px;max-width:470px}
h1 em{font-style:normal;color:#f5a623}
.chips{display:flex;gap:10px;flex-wrap:wrap;max-width:480px}
.chip{font-size:15px;font-weight:600;color:#dbe7f2;background:rgba(219,231,242,.10);
   border:1px solid rgba(219,231,242,.22);padding:8px 15px;border-radius:999px}
.rule{width:64px;height:4px;border-radius:2px;background:#f5a623}
</style>
<div class="g">
  <div class="photos">
    <img class="a" src="../assets/images/photos/goma@3x.jpg">
    <img class="b" src="../assets/images/photos/kinshasa@3x.jpg">
    <img class="c" src="../assets/images/photos/lubumbashi@3x.jpg">
  </div>
  <div class="fade"></div>
  <div class="glow"></div>
  <div class="copy">
    <img src="../assets/images/wordmark.png">
    <div class="rule"></div>
    <h1>Book your <em>whole trip</em><br>in one app.</h1>
    <div class="chips"><span class="chip">Flights</span><span class="chip">Hotels</span><span class="chip">Restaurants</span><span class="chip">Activities</span></div>
  </div>
</div>
